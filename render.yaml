services:
  - type: web
    name: zundenova-api
    env: node
    buildCommand: cd apps/api && npm install && npm run build
    startCommand: cd apps/api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: zundenova-postgres
          property: connectionString
      - key: MONGODB_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: zundenova-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false

  - type: web
    name: zundenova-web
    env: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: ./apps/web/.next
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://zundenova-api.onrender.com

databases:
  - name: zundenova-postgres
    databaseName: zundenova
    user: zundenova

  - name: zundenova-redis
