apiVersion: apps/v1
kind: Deployment
metadata:
  name: zundenova-api
  namespace: zundenova
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zundenova-api
  template:
    metadata:
      labels:
        app: zundenova-api
    spec:
      containers:
      - name: api
        image: zundenova/api:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: zundenova-secrets
              key: database-url
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: zundenova-secrets
              key: mongodb-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: zundenova-secrets
              key: redis-url
        - name: FIREBASE_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: zundenova-secrets
              key: firebase-project-id
        - name: FIREBASE_SERVICE_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: zundenova-secrets
              key: firebase-service-account
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: zundenova-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zundenova-api-service
  namespace: zundenova
spec:
  selector:
    app: zundenova-api
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP
