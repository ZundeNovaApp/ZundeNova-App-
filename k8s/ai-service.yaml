apiVersion: apps/v1
kind: Deployment
metadata:
  name: zundenova-ai-service
  namespace: zundenova
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zundenova-ai-service
  template:
    metadata:
      labels:
        app: zundenova-ai-service
    spec:
      containers:
      - name: ai-service
        image: zundenova/ai-service:latest
        ports:
        - containerPort: 8001
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        - name: CORS_ORIGINS
          value: "https://zundenova.com,https://api.zundenova.com"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zundenova-ai-service
  namespace: zundenova
spec:
  selector:
    app: zundenova-ai-service
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zundenova-ai-service-ingress
  namespace: zundenova
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - ai.zundenova.com
    secretName: ai-zundenova-tls
  rules:
  - host: ai.zundenova.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zundenova-ai-service
            port:
              number: 8001
