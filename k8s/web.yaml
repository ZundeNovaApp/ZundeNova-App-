apiVersion: apps/v1
kind: Deployment
metadata:
  name: zundenova-web
  namespace: zundenova
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zundenova-web
  template:
    metadata:
      labels:
        app: zundenova-web
    spec:
      containers:
      - name: web
        image: zundenova/web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.zundenova.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zundenova-web-service
  namespace: zundenova
spec:
  selector:
    app: zundenova-web
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zundenova-ingress
  namespace: zundenova
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - zundenova.com
    - api.zundenova.com
    secretName: zundenova-tls
  rules:
  - host: zundenova.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zundenova-web-service
            port:
              number: 3000
  - host: api.zundenova.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zundenova-api-service
            port:
              number: 3001
