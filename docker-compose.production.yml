version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zundenova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-zundenova}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-zundenova}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secure_password}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zundenova}:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/${POSTGRES_DB:-zundenova}
      MONGODB_URI: mongodb://${MONGO_USERNAME:-zundenova}:${MONGO_PASSWORD:-secure_password}@mongodb:27017/zundenova
      REDIS_URL: redis://:${REDIS_PASSWORD:-secure_password}@redis:6379
      AI_SERVICE_URL: http://ai-service:8001
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME}
      FLUTTERWAVE_PUBLIC_KEY: ${FLUTTERWAVE_PUBLIC_KEY}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - mongodb
      - redis
      - ai-service
    restart: unless-stopped

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: info
      CORS_ORIGINS: "https://zundenova.com,https://api.zundenova.com"
    ports:
      - "8001:8001"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.zundenova.com
      NEXT_PUBLIC_AI_SERVICE_URL: https://ai.zundenova.com
    ports:
      - "3000:3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api
      - ai-service
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
