[build]
  base = "apps/web"
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NEXT_PUBLIC_API_URL = "https://zundenova-api.railway.app"

[[redirects]]
  from = "/api/*"
  to = "https://zundenova-api.railway.app/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
