<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZundeNova - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #00684b, #007f82);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 500px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 16px;
        }
        p {
            font-size: 18px;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .features {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .feature {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 16px;
        }
        .feature-icon {
            margin-right: 12px;
            font-size: 20px;
        }
        .retry-btn {
            background: #dbc600;
            color: #00684b;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌱</div>
        <h1>You're Offline</h1>
        <p>Don't worry! ZundeNova works offline too. You can still access many features while disconnected.</p>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">🤖</span>
                <span>AI Diagnostics (offline models)</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🎤</span>
                <span>Voice input and transcription</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📝</span>
                <span>Farm records management</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📚</span>
                <span>Educational content (downloaded)</span>
            </div>
            <div class="feature">
                <span class="feature-icon">💬</span>
                <span>Community Q&A (cached)</span>
            </div>
        </div>

        <button class="retry-btn" onclick="window.location.reload()">
            Try Again
        </button>
    </div>
</body>
</html>
